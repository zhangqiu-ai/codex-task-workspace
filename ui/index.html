<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Workspace</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="shell"><aside class="sidebar"><a class="brand" href="/">◈ <span>Task Workspace<small>LOCAL · V0.1</small></span></a><div id="workspace-name" class="workspace-name">本地工作区</div><nav id="navigation" aria-label="工作区导航" data-i18n-aria-label="工作区导航"></nav><div class="section-label"><span data-i18n="PROJECTS">PROJECTS</span> <button id="new-project" class="icon-button" aria-label="新建项目" data-i18n-aria-label="添加项目" title="添加项目" data-i18n-title="添加项目">＋</button></div><nav id="projects" aria-label="项目" data-i18n-aria-label="项目"></nav><button id="open-settings" class="nav settings-link" type="button">⚙ <span data-i18n="设置">设置</span></button><div class="sidebar-footer" title="数据保存在这台设备" data-i18n-title="数据保存在这台设备"><span class="status-dot"></span> <span data-i18n="本地">本地</span></div></aside><main><header><div><h1 id="view-title">My Work</h1></div><div class="header-actions"><button class="primary glyph-button" id="new-task" title="新建任务" data-i18n-title="新建任务" aria-label="新建任务" data-i18n-aria-label="新建任务">＋</button></div></header><div id="connection-notice" role="status" hidden></div><div id="notice" role="status" hidden></div><section id="board" class="board" tabindex="0" aria-label="任务看板，可左右滚动查看所有状态列" data-i18n-aria-label="任务看板，可左右滚动查看所有状态列"></section><section id="settings-page" hidden aria-labelledby="view-title">
<div class="settings-group"><h2 data-i18n="界面">界面</h2>
<div class="setting-row"><span id="language-label" data-i18n="界面语言">界面语言</span><div class="language-segments" role="group" aria-labelledby="language-label"><button type="button" data-setting-language="zh" lang="zh-CN">简体中文</button><button type="button" data-setting-language="en" lang="en">English</button></div></div>
<div class="setting-row"><div class="setting-label"><label for="setting-motion" data-i18n="任务动效">任务动效</label><button class="setting-help" type="button" aria-label="进行中任务的呼吸提示，遵循系统减少动态效果设置。" data-i18n-aria-label="进行中任务的呼吸提示，遵循系统减少动态效果设置。" data-i18n-title="进行中任务的呼吸提示，遵循系统减少动态效果设置。" title="进行中任务的呼吸提示，遵循系统减少动态效果设置。">?</button></div><input id="setting-motion" class="setting-switch" role="switch" type="checkbox"></div></div>
<div class="settings-group"><h2 data-i18n="本地与采集">本地与采集</h2><div class="setting-row"><span data-i18n="数据存储">数据存储</span><span class="setting-value" data-i18n="仅本机 · SQLite">仅本机 · SQLite</span></div><div class="setting-row"><div class="setting-label"><span>Hook</span><button id="settings-hook-note" class="setting-help" type="button">?</button></div><span id="settings-hook" class="setting-badge"></span></div></div>
<p class="settings-footnote" data-i18n="设置自动保存到当前浏览器。">设置自动保存到当前浏览器。</p></section></main></div><dialog id="detail" aria-label="任务详情" data-i18n-aria-label="任务详情"><div class="dialog-top"><span class="eyebrow" data-i18n="TASK CONTEXT">TASK CONTEXT</span><div class="dialog-controls"><button id="close-detail" class="glyph-button" aria-label="关闭详情" data-i18n-aria-label="关闭详情" title="关闭详情" data-i18n-title="关闭详情">×</button></div></div><div id="detail-content"></div></dialog><dialog id="form-dialog" aria-labelledby="form-title"><form id="entry-form"><div class="form-heading"><h2 id="form-title"></h2></div><div id="form-fields"></div><div class="form-actions"><button type="button" id="cancel-form" data-i18n="取消">取消</button><button class="primary" type="submit" data-i18n="保存">保存</button></div></form></dialog><dialog id="import-dialog" aria-label="添加项目" data-i18n-aria-label="添加项目"><div class="dialog-top"><h2 data-i18n="添加项目">添加项目</h2><div class="dialog-controls"><button id="close-import" class="glyph-button" type="button" data-i18n-aria-label="关闭" aria-label="关闭" data-i18n-title="关闭" title="关闭">×</button></div></div><p class="muted" data-i18n="选择 Codex 已保存的本地项目，仅关联目录。">选择 Codex 已保存的本地项目，仅关联目录。</p><div id="import-projects"></div><div class="form-actions"><button id="manual-project" type="button" data-i18n="手动创建">手动创建</button></div></dialog><script type="module" src="/app.js"></script></body></html>
