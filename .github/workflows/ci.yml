name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/dev]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: git diff --check
